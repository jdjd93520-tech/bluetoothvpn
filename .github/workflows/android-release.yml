name: Build BluetoothVPN Release APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'bluetooth_vpn/**'
      - '*.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-26 build-tools;27.0.3'

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :bluetooth_vpn:assembleRelease

      - name: Sign release APK
        run: |
          set -euo pipefail
          APK="$(find bluetooth_vpn/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/bluetoothvpn-release.jks" -storepass android -keypass android -alias bluetoothvpn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BluetoothVPN Release, OU=Build, O=Open Source, L=NA, S=NA, C=US"
          zipalign -f -p 4 "$APK" "$RUNNER_TEMP/bluetoothvpn-aligned.apk"
          apksigner sign --ks "$RUNNER_TEMP/bluetoothvpn-release.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/BluetoothVPN-release.apk" "$RUNNER_TEMP/bluetoothvpn-aligned.apk"
          apksigner verify --verbose "$RUNNER_TEMP/BluetoothVPN-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothVPN-release-apk
          path: ${{ runner.temp }}/BluetoothVPN-release.apk
          if-no-files-found: error
          retention-days: 14
